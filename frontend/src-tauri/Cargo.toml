[package]
name = "ataai"
version = "0.1.0"
description = "AtaAI desktop"
authors = ["AtaAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ataai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
