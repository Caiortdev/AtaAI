<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>AtaAI offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: #0f172a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 16px 40px rgb(15 23 42 / 0.08);
      }

      h1 {
        margin: 8px 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.5;
      }

      strong {
        color: #0f766e;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>AtaAI</strong>
      <h1>Sem conexao no momento</h1>
      <p>
        A interface do aplicativo esta disponivel, mas login, upload, transcricao e geracao de ata
        precisam de conexao com a API.
      </p>
    </main>
  </body>
</html>
